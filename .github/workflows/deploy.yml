name: 🚀 Deploy Dartomat

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Prepare Nginx production build (Docker context)
        run: |
          # Statisches App-Bundle: keine Build-Tools nötig.
          mkdir -p dist/nginx-build

          # Statische Dateien in den Build-Ordner kopieren
          cp -r index.html styles.css favicon.png js dist/nginx-build/

          # Nginx-Konfiguration
          cat <<EOF > dist/nginx-build/nginx.conf
          server {
            listen 80;
            location / {
              root /usr/share/nginx/html;
              index index.html;
              try_files \$uri \$uri/ /index.html;
            }
          }
          EOF

          # Dockerfile für Nginx-Server
          cat <<EOF > dist/nginx-build/Dockerfile
          FROM nginx:alpine
          COPY . /usr/share/nginx/html
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./dist/nginx-build
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: 🔁 Restart Docker on Server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/srv/server-config
            docker pull ghcr.io/${{ github.repository }}:latest
            docker compose up -d dartomat --force-recreate
